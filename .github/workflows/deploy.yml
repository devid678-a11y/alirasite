name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alira-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          install -m 700 -d ~/.ssh
          printf '%s' "$DEPLOY_SSH_KEY" | base64 --decode | tr -d '\r' > ~/.ssh/alira_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/alira_deploy ~/.ssh/known_hosts

      - name: Sync application files
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          rsync -rlz \
            -e 'ssh -i ~/.ssh/alira_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes' \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.next/' \
            --exclude='node_modules/' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='public/uploads/' \
            --exclude='src/data/*.json' \
            --exclude='scratch/' \
            --exclude='deploy/' \
            --exclude='sshnet/' \
            --exclude='sshnet2020/' \
            --exclude='sshnet.zip' \
            --exclude='sshnet2020.zip' \
            --exclude='project_handover.md' \
            --exclude='SshTunnel.cs' \
            --exclude='deploy_*.py' \
            --exclude='restart_pm2.py' \
            --exclude='restore_local_files.py' \
            --exclude='ssh_check.py' \
            --exclude='upload_pages.py' \
            --exclude='verify_product.ps1' \
            ./ "$DEPLOY_USER@$DEPLOY_HOST:/var/www/alira/"

      - name: Build, restart, and check site
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/alira_deploy \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            'cd /var/www/alira && npm install --package-lock-only --ignore-scripts --no-audit --no-fund && npm ci && npm run build && sudo -n /usr/local/sbin/alira-pm2-restart && i=0; while [ "$i" -lt 30 ]; do if curl --fail --silent --max-time 5 http://127.0.0.1:3000/ >/dev/null; then exit 0; fi; i=$((i + 1)); sleep 2; done; echo 'Site did not become healthy on port 3000' >&2; exit 1'
