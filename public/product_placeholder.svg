<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <rect width="100%" height="100%" fill="#f8fafc"/>
  <!-- Outline of a device -->
  <rect x="130" y="80" width="140" height="100" rx="8" fill="none" stroke="#94a3b8" stroke-width="4"/>
  <!-- Screen of device -->
  <rect x="145" y="95" width="70" height="70" rx="4" fill="none" stroke="#cbd5e1" stroke-width="3"/>
  <!-- Waveform inside screen -->
  <path d="M 155 130 Q 162.5 105, 170 130 T 185 130 T 200 130" fill="none" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
  <!-- Knobs and buttons -->
  <circle cx="245" cy="105" r="8" fill="none" stroke="#cbd5e1" stroke-width="3"/>
  <circle cx="245" cy="125" r="5" fill="#cbd5e1"/>
  <circle cx="245" cy="140" r="5" fill="#cbd5e1"/>
  <circle cx="245" cy="155" r="5" fill="#cbd5e1"/>
  <!-- Text -->
  <text x="200" y="225" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#94a3b8" text-anchor="middle">Нет изображения</text>
</svg>
