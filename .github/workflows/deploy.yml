name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alira-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          install -m 700 -d ~/.ssh
          printf '%s' "$DEPLOY_SSH_KEY" | base64 --decode | tr -d '\r' > ~/.ssh/alira_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/alira_deploy ~/.ssh/known_hosts

      - name: Sync application files
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          rsync -rlz \
            -e 'ssh -i ~/.ssh/alira_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes' \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.next/' \
            --exclude='node_modules/' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='public/uploads/' \
            --exclude='src/data/*.json' \
            --exclude='scratch/' \
            --exclude='deploy/' \
            --exclude='sshnet/' \
            --exclude='sshnet2020/' \
            --exclude='sshnet.zip' \
            --exclude='sshnet2020.zip' \
            --exclude='project_handover.md' \
            --exclude='SshTunnel.cs' \
            --exclude='deploy_*.py' \
            --exclude='restart_pm2.py' \
            --exclude='restore_local_files.py' \
            --exclude='ssh_check.py' \
            --exclude='upload_pages.py' \
            --exclude='verify_product.ps1' \
            ./ "$DEPLOY_USER@$DEPLOY_HOST:/var/www/alira/"

      - name: Build, restart, and check site
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/alira_deploy \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            bash -s -- "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" <<'REMOTE'
          set -euo pipefail

          build_id="${1:?missing build id}"
          build_dir=".next-release-${build_id}"
          legacy_dir=".next-legacy-${build_id}"
          swap_link=".next-swap-${build_id}"
          rollback_link=".next-rollback-${build_id}"

          cd /var/www/alira

          # Remove inactive release directories before building to recover disk space.
          # Preserve the build currently linked as .next so the live process stays untouched.
          active_build=""
          if [ -L .next ]; then
            active_build="$(readlink -f .next || true)"
          fi
          for stale_build in .next-release-* .next-legacy-*; do
            [ -e "$stale_build" ] || [ -L "$stale_build" ] || continue
            stale_real="$(readlink -f "$stale_build" || true)"
            if [ -n "$active_build" ] && [ "$stale_real" = "$active_build" ]; then
              continue
            fi
            echo "Removing inactive build $stale_build"
            if ! rm -rf -- "$stale_build"; then
              echo "Could not fully remove inactive build $stale_build; continuing deployment" >&2
            fi
          done

          # The old Next process runs as root. Build into an isolated directory so it
          # cannot write into the files currently used by the live process.
          if [ -d .next ] && [ ! -L .next ]; then
            owner="$(stat -c '%U' .next)"
            deploy_user="$(id -un)"
            if [ "$owner" != "$deploy_user" ]; then
              echo "Cannot switch .next: directory owner is $owner, deployment user is $deploy_user" >&2
              exit 1
            fi
          fi
          if [ -e "$build_dir" ]; then
            echo "Build directory already exists: $build_dir" >&2
            exit 1
          fi

          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci
          NEXT_DIST_DIR="$build_dir" npm run build
          test -f "$build_dir/standalone/server.js"

          previous_target=""
          if [ -L .next ]; then
            previous_target="$(readlink .next)"
            ln -s "$build_dir" "$swap_link"
            mv -Tf "$swap_link" .next
          elif [ -e .next ]; then
            mv .next "$legacy_dir"
            previous_target="$legacy_dir"
            ln -s "$build_dir" .next
          else
            ln -s "$build_dir" .next
          fi

          restore_previous() {
            if [ -n "$previous_target" ]; then
              ln -s "$previous_target" "$rollback_link"
              mv -Tf "$rollback_link" .next
              sudo -n /usr/local/sbin/alira-pm2-restart || true
            fi
          }

          if ! sudo -n /usr/local/sbin/alira-pm2-restart; then
            echo "PM2 restart failed; restoring previous build" >&2
            restore_previous
            exit 1
          fi

          healthy=0
          for i in $(seq 1 30); do
            if curl --fail --silent --max-time 5 http://127.0.0.1:3000/ >/dev/null; then
              healthy=1
              break
            fi
            sleep 2
          done

          if [ "$healthy" -ne 1 ]; then
            echo "Site did not become healthy on port 3000; restoring previous build" >&2
            restore_previous
            exit 1
          fi

      - name: Send one-time mail test and saved-submission archive
        if: contains(github.event.head_commit.message, '[forms-check]')
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/alira_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" bash -s <<'REMOTE'
          set -euo pipefail
          cd /var/www/alira
          node <<'NODE'
          const fs = require("node:fs");
          const zlib = require("node:zlib");
          const nodemailer = require("nodemailer");
          require("@next/env").loadEnvConfig(process.cwd());

          async function main() {
            const smtpUser = process.env.SMTP_USER;
            const smtpPass = process.env.SMTP_PASS;
            const smtpFrom = process.env.SMTP_FROM;
            const smtpHost = process.env.SMTP_HOST || "smtp.yandex.ru";
            const smtpPort = Number(process.env.SMTP_PORT) || 465;
            if (!smtpUser || !smtpPass || !smtpFrom) {
              throw new Error("SMTP_USER, SMTP_PASS, or SMTP_FROM is missing");
            }

            const transporter = nodemailer.createTransport({
              host: smtpHost,
              port: smtpPort,
              secure: smtpPort === 465,
              auth: { user: smtpUser, pass: smtpPass }
            });

            await transporter.verify();
            const testInfo = await transporter.sendMail({
              from: smtpFrom,
              to: "info@aliracert.ru",
              subject: "[ТЕСТ ФОРМ АЛИРА] Проверка доставки",
              text: "Тест отправки уведомлений сайта. Форма сайта не заполнялась; обращение в список заявок не добавлено."
            });
            console.log("TEST_MAIL_ACCEPTED accepted=" + testInfo.accepted.length + " response=" + testInfo.response);

            const filePath = "src/data/submissions.json";
            if (!fs.existsSync(filePath)) {
              console.log("SUBMISSIONS_ARCHIVE missing");
              await transporter.close();
              return;
            }

            const rows = JSON.parse(fs.readFileSync(filePath, "utf8"));
            if (!Array.isArray(rows)) throw new Error("Saved submissions file is not an array");
            const dateOf = row => {
              const raw = row.submittedAt || row.date || row.createdAt || row.timestamp;
              const value = Date.parse(raw || "");
              return Number.isFinite(value) ? new Date(value).toISOString() : null;
            };
            const counts = {};
            for (const row of rows) {
              const type = String(row.type || "unknown");
              counts[type] = (counts[type] || 0) + 1;
            }
            const dates = rows.map(dateOf).filter(Boolean).sort();
            console.log("SUBMISSIONS_ARCHIVE_META " + JSON.stringify({
              count: rows.length,
              earliest: dates[0] || null,
              latest: dates[dates.length - 1] || null,
              types: counts
            }));

            if (rows.length) {
              const archive = {
                note: "Все записи из серверного submissions.json. Приложение не сохраняло статус доставки писем, поэтому это архив сохранённых заявок, а не доказанный список недоставленных писем.",
                submissions: rows
              };
              const compressed = zlib.gzipSync(Buffer.from(JSON.stringify(archive, null, 2), "utf8"), { level: 9 });
              const archiveInfo = await transporter.sendMail({
                from: smtpFrom,
                to: "info@aliracert.ru",
                subject: "[АРХИВ ЗАЯВОК АЛИРА] " + rows.length + " сохранённых записей",
                text: "Во вложении архив заявок, сохранённых сайтом. Статусы доставки для старых записей не сохранялись; сверьте архив с ранее полученными письмами. Файл сжат в gzip.",
                attachments: [{
                  filename: "alira-saved-submissions.json.gz",
                  content: compressed,
                  contentType: "application/gzip"
                }]
              });
              console.log("SUBMISSIONS_ARCHIVE_ACCEPTED accepted=" + archiveInfo.accepted.length + " compressed_bytes=" + compressed.length + " response=" + archiveInfo.response);
            }
            await transporter.close();
          }

          main().catch(error => {
            console.error("FORMS_CHECK_FAILED", error.message);
            process.exitCode = 1;
          });
          NODE
          REMOTE
